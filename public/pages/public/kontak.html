<section class="kontak-page">
    <!-- Page Banner -->
    <div class="page-banner">
        <div class="container page-banner-inner">
            <div class="page-banner-icon">
                <i class="fa-solid fa-phone-volume" aria-hidden="true"></i>
            </div>
            <div>
                <h1>Kontak &amp; Informasi</h1>
                <p>Hubungi kami untuk informasi lebih lanjut.</p>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="container page-content">
        <!-- Info Utama -->
        <div class="kontak-grid">
            <div class="kontak-card">
                <div class="icon blue"><i class="fa fa-phone"></i></div>
                <h4>Telepon</h4>
                <p id="kPhone">-</p>
                <small>Jam Pelayanan Kelurahan</small>
            </div>
            <div class="kontak-card">
                <div class="icon green"><i class="fa fa-envelope"></i></div>
                <h4>Email</h4>
                <p id="kEmail">-</p>
                <small>Respon dalam 1&times;24 jam</small>
            </div>
            <div class="kontak-card">
                <div class="icon purple">
                    <i class="fa fa-location-dot"></i>
                </div>
                <h4>Alamat</h4>
                <p id="kAddress">-</p>
                <small id="kAddress2">-</small>
            </div>
        </div>

        <!-- Jam & Sosial -->
        <div class="kontak-row">
            <div class="kontak-box">
                <h3>Jam Pelayanan &amp; Info</h3>
                <p
                    id="kProfil"
                    style="
                        font-size: 14px;
                        color: var(--muted);
                        line-height: 1.5;
                        white-space: pre-wrap;
                    "
                >
                    -
                </p>
            </div>
            <div class="kontak-box">
                <h3>Media Sosial</h3>
                <ul class="sosial-list">
                    <li id="kIgRow" style="display: none">
                        <i class="fab fa-instagram"></i>
                        <span id="kInstagram"></span>
                    </li>
                    <li id="kFbRow" style="display: none">
                        <i class="fab fa-facebook"></i>
                        <span id="kFacebook"></span>
                    </li>
                    <li id="kYtRow" style="display: none">
                        <i class="fab fa-youtube"></i>
                        <span id="kYoutube"></span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Kontak RT/RW -->
        <div class="kontak-box">
            <h3>Kontak RT / RW</h3>
            <div class="rt-grid" id="kRtGrid">
                <div style="font-size: 13px; color: var(--muted)">
                    Memuat kontak RT/RW...
                </div>
            </div>
        </div>

        <!-- FAQ -->
        <div class="kontak-box">
            <h3>Pertanyaan yang Sering Diajukan (FAQ)</h3>
            <div id="kFaqBox">
                <div style="font-size: 13px; color: var(--muted)">
                    Memuat FAQ...
                </div>
            </div>
        </div>
    </div>
</section>
