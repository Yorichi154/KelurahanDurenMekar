<section class="berita-page">
  <div class="container">
    <div class="page-head">
      <h1>Berita & Informasi</h1>
      <p>Informasi terbaru dari kelurahan untuk masyarakat.</p>
    </div>

    <div class="berita-toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="beritaSearch" type="search" placeholder="Cari berita..." />
      </div>

      <div class="filter-tabs" id="beritaTabs">
        <button class="tab active" data-filter="all">Semua</button>
        <button class="tab" data-filter="Pengumuman">Pengumuman</button>
        <button class="tab" data-filter="Kegiatan">Kegiatan</button>
        <button class="tab" data-filter="Kesehatan">Kesehatan</button>
      </div>
    </div>

    <div id="beritaContainer" class="berita-grid"></div>

    <!-- Detail Berita Modal -->
    <div class="modal" id="publicBeritaModal" aria-hidden="true">
      <div class="modal-panel" style="max-width: 760px; width: 90%; max-height: 90vh; overflow-y: auto; border-radius: var(--radius);">
        <div class="modal-head" style="position: sticky; top: 0; background: var(--surface); z-index: 10; border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;">
          <h3 style="margin: 0;" id="publicBeritaTitle">Detail Berita</h3>
          <button class="btn btn-ghost" id="closePublicBeritaModalBtn" style="padding: 6px 10px;">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body" style="padding: 20px;">
          <img id="publicBeritaImage" src="" alt="" style="width: 100%; max-height: 380px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; display: none;">
          <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px;">
            <span class="badge" id="publicBeritaCategory" style="background: rgba(31, 95, 224, 0.1); color: var(--primary); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700;"></span>
            <small class="muted" id="publicBeritaDate"></small>
          </div>
          <h2 id="publicBeritaHeadline" style="font-size: 22px; font-weight: 950; line-height: 1.3; margin-bottom: 16px;"></h2>
          <div id="publicBeritaContent" style="font-size: 14px; line-height: 1.6; color: #334155; white-space: pre-wrap;"></div>
        </div>
      </div>
    </div>

  </div>
</section>

<script src="assets/js/public/berita.js"></script>
