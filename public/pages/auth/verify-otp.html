<section class="auth-page">
  <div class="auth-card">

    <div class="auth-icon">
      <i class="fa-solid fa-key"></i>
    </div>

    <h2>Verifikasi OTP</h2>
    <p class="auth-subtitle">
      Masukkan 6 digit kode OTP yang telah dikirim ke alamat email Anda.
    </p>

    <div id="otpError" class="auth-error" style="display:none; margin:12px 0; padding:10px 12px; border-radius:10px; background:#fee2e2; color:#991b1b; font-weight:700; line-height: 1.5;">
      Kode OTP tidak valid atau sudah kedaluwarsa.
    </div>

    <form id="verifyOtpForm">
      <label>Alamat Email</label>
      <input type="email" id="otpEmail" placeholder="nama@email.com" required readonly style="background-color: #f3f4f6; color: #6b7280; cursor: not-allowed;">

      <label style="margin-top: 15px;">Kode OTP 6-Digit</label>
      <input type="text" id="otpCode" placeholder="******" maxlength="6" pattern="[0-9]{6}" autocomplete="off" required style="font-size: 24px; text-align: center; letter-spacing: 8px; font-weight: bold; border-color: #1e3a8a;">

      <button type="submit" class="btn-auth" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:20px;">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i> Verifikasi Kode OTP
      </button>

      <a href="#" class="back-home nav-link" data-page="forgot-password" style="margin-top:16px;">
        ← Kembali ke Lupa Password
      </a>
    </form>
  </div>
</section>
